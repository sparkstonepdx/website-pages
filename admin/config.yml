# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# To get closer to wordpress we can add
# soft redirects (can be a stub store and point places in sveltia)
# lists (for filtering tags to show a subset of posts)
#
# settings singleton
# - logo
# - social links
#
publish_mode: editorial_workflow
backend:
  name: github
  repo: sparkstonepdx/website-src
  base_url: https://sveltia-cms-auth.sparkstonepdx.workers.dev
  preview_context: preview-pr

media_folder: "/public"
public_folder: "/"
app_title: Sparkstone Admin

media_libraries:
  default:
    config:
      slugify_filename: true


# Reusable Snippets
seo: &seo
  label: SEO
  name: seo
  widget: object
  collapsed: true
  fields:
    - { label: Title, name: title, widget: string, required: false, hint: "Used as-is. Falls back to Heading | Company Name" }
    - { label: Description, name: description, widget: text, required: false, hint: "Falls back to Intro" }
    - { label: Social image, name: image, widget: image, required: false }
    - { label: Keywords, name: keywords, widget: list, required: false, hint: "Replaces the site keywords" }

booking_cta: &booking_cta
  label: Booking Call To Action
  name: booking_cta
  widget: object
  collapsed: auto
  fields:
    - { label: Heading, name: heading, widget: string, required: false, hint: "Used as the heading for the booking cta" }
    - { label: Body, name: body, widget: richtext, required: false }
    - { label: Action Text, name: action_label, widget: string, required: false, hint: 'Used as the button text' }

testimonials: &testimonials
  label: "Testimonials"
  name: "testimonials"
  widget: relation
  collection: testimonials
  value_field: "{{slug}}"
  search_fields: [name]
  display_fields: [name, quote]
  required: false
  multiple: true

  
singletons:
  - name: home
    label: Home Page
    file: "src/data/home.mdx"
    icon: home
    fields:
      - { label: "body", name: "body", widget: "markdown" }
      - label: Featured On
        name: featuredOn
        widget: list
        field:
          label: Feature
          name: feature
          widget: object
          fields:
            - { label: Logo, name: logo, widget: optimizedImage }
            - { label: URL, name: url, widget: string, type: url }
            - { label: Name, name: name, widget: string }
      - <<: *testimonials
      - label: Featured
        name: featured
        widget: list
        max: 3
        hint: Homepage order. Posts and products are limited to the business audience.
        types:
          - label: Case study
            name: case_study
            widget: object
            fields:
              - { label: Case study, name: entry, widget: relation, collection: case-studies, value_field: "{{slug}}", search_fields: [title, client], display_fields: [title] }
          - label: Product
            name: product
            widget: object
            fields:
              - label: Product
                name: entry
                widget: relation
                collection: products
                value_field: "{{slug}}"
                search_fields: [title]
                display_fields: [title]
                filters: [{ field: audience, values: [business] }]
          - label: Post
            name: post
            widget: object
            fields:
              - label: Post
                name: entry
                widget: relation
                collection: Posts
                value_field: "{{slug}}"
                search_fields: [title]
                display_fields: [title]
                filters: [{ field: audience, values: [business] }]
      - label: services
        name: services
        widget: list
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: markdown }
  - name: settings
    label: Settings
    file: "src/data/settings.yml"
    icon: settings
    delete: false
    fields:
      - { name: headerMenu, label: "Header Menu", widget: relation, collection: menus, search_fields: [name]}
      - { name: footerMenu, label: "Footer Menu", widget: relation, collection: menus, search_fields: [name]}
      - { name: companyName, label: 'Company Name', widget: string }
      - <<: *booking_cta
        label: Default Booking CTA
        hint: Used when a page using a booking cta but is left blank
      - <<: *seo
        label: SEO defaults / seo
        hint: Used when a route has no page and no overrides

collections:
  - name: case-studies
    label: Case Studies
    label_singular: Case Study
    icon: clinical_notes
    create: true
    reorder: true
    extension: mdx
    folder: "src/routes/case-studies/(records)"
    preview_path: "/case-studies/{{filename}}"
    media_folder: "/public/media/case-studies"
    public_folder: "/media/case-studies"
    summary: "{{title}} · {{client}}"
    fields:
      - { label: "Title", name: "title", widget: "string", minlength: 5 }
      - { label: "Client", name: "client", widget: "string" }
      - label: Segment
        name: segment
        widget: select
        options:
          - { label: "Medical practice", value: medical }
          - { label: "Law firm", value: legal }
          - { label: "Specialty contractor", value: contractor }
          - { label: "Community organization", value: community }
          - { label: "Other", value: other }
      - label: Engagement
        name: engagement
        widget: select
        options:
          - { label: "Paid client", value: paid }
          - { label: "Partner", value: partner }
          - { label: "Volunteer", value: volunteer }
      - label: Services
        name: services
        widget: select
        multiple: true
        options:
          - { label: "Custom application", value: custom-application }
          - { label: "Project rescue", value: project-rescue }
          - { label: "Fractional CTO", value: fractional-cto }
          - { label: "Technical review", value: technical-review }
      - { label: "Products used", name: "products", widget: relation, collection: products, value_field: "{{slug}}", search_fields: [title], display_fields: [title], multiple: true, required: false }
      - { label: "Blurb", name: "blurb", widget: "string" }
      - { label: "Problem", name: "problem", widget: "text", required: false }
      - { label: "Built", name: "built", widget: "text", required: false }
      - { label: "Result", name: "result", widget: "string", required: false, hint: "One sentence, with a number if one exists" }
      - { label: "Timeline", name: "timeline", widget: "string", required: false }
      - { label: "Live URL", name: "url", widget: "string", type: url, required: false }
      - <<: *testimonials
      - { label: "Created", name: "created", widget: "datetime", default: "{{now}}" }
      - { label: "Published", name: "published", widget: "datetime", default: "{{now}}" }
      - { label: "Featured Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Featured Image Alt", name: "thumbnailAlt", widget: "string", required: false }
      - <<: *booking_cta
      - { label: "Body", name: "body", widget: "markdown" }

  
   
  - name: menus
    label: Menus
    icon: menu
    label_singular: Menu
    create: true
    format: yml
    slug: "{{fields.name}}"
    folder: "src/data/menus/"
    fields:
      - { label: "Menu Name", name: "name", widget: "string", required: true }
      - { label: "Display Title", name: "displayTitle", widget: "string" }
      - label: "Menu Items"
        label_singular: Menu Item
        name: items
        widget: list
        hint: Add all the links that belong to this specific menu (e.g., Header or Footer).
        types:
          - label: "Page"
            name: "page_item"
            fields:
              - { label: "Page", name: "item", widget: relation, collection: pages, search_fields: [heading, route], display_fields: [heading] }
              - { label: "Label override", name: "label", widget: string, required: false, hint: "Falls back to page heading" }
          - label: "Link Item"
            name: "link_item"
            fields:
              - label: "Link"
                name: "item"
                widget: "relation"
                collection: "links"
                search_fields: ["label"]
                display_fields: ["label"]
              - { label: "Label override", name: "label", widget: string, required: false, hint: "Falls back to link label" }
          - label: "Nested Menu"
            name: "nested_menu"
            fields:
              - label: "Menu"
                name: "item"
                widget: "relation"
                collection: "menus"
                search_fields: ["name"]
                display_fields: ["name"]
              - { label: "Label override", name: "label", widget: string, required: false, hint: "Falls back to menu name" }

  - name: links
    label: Links
    label_singular: Link
    format: yml
    create: true
    icon: link
    folder: "src/data/links/"
    slug: "{{fields.label}}"
    fields:
      - { label: "Display Label", name: "label", widget: "string", minlength: 2 }
      - { label: Description, name: description, widget: string, required: false}
      - { label: "URL", name: "url", widget: "string", type: url, required: false }
      - { label: "Parent Item", name: "parent", widget: relation, collection: links, search_fields: [label], display_fields: [label], required: false } # For hierarchy
      - { label: "Visible", name: "visible", widget: "boolean", default: true }
      - { label: Custom Attributes, name: customAttributes, required: false, widget: 'string'}

  
  - name: pages
    label: Pages
    label_singular: Page
    icon: article
    create: true
    extension: mdx
    folder: "src/data/pages/"
    preview_path: "{{fields.route}}"
    slug: "{{fields.heading}}"
    summary: "{{heading}} · {{route}}"
    fields:
      - { label: "Route", name: "route", widget: "string", hint: "e.g. /products" }
      - { label: "Heading", name: "heading", widget: "string" }
      - { label: "Intro", name: "intro", widget: "text", required: false }
      - <<: *seo
      - { label: Content, name: body, widget: markdown, required: false}

  - name: products
    label: Products
    label_singular: Product
    icon: package_2
    create: true
    reorder: true
    extension: mdx
    folder: "src/routes/products/(records)"
    preview_path: "/products/{{filename}}"
    media_folder: "/public/media/products"
    public_folder: "/media/products"
    summary: "{{title}} · {{audience}}"
    view_filters:
      - { label: Business, field: audience, pattern: business }
      - { label: Developer, field: audience, pattern: developer }
      - { label: Personal, field: audience, pattern: personal }
    fields:
      - { label: "Title", name: "title", widget: "string", minlength: 5 }
      - label: Audience
        name: audience
        widget: select
        options:
          - { label: "Business buyers", value: business }
          - { label: "Developers", value: developer }
          - { label: "Personal", value: personal }
      - { label: "Is Opensource", name: "isOpensource", widget: "boolean", required: false }
      - { label: "Live URL", name: "url", widget: "string", type: url, required: false }
      - { label: "Repository", name: "repo", widget: "string", type: url, required: false }
      - { label: "Package", name: "package", widget: "string", required: false, hint: "npm name, e.g. @sparkstone/css" }
      - { label: "Created", name: "created", widget: "datetime", type: date, format: "YYYY-MM-DD", default: "{{now}}" }
      - { label: "Published", name: "published", widget: "datetime", type: date, format: "YYYY-MM-DD", default: "{{now}}" }
      - { label: "Featured Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Featured Image Alt", name: "thumbnailAlt", widget: "string", required: false }
      - { label: "Blurb", name: "blurb", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - <<: *testimonials
      - <<: *booking_cta
      - { label: "Body", name: "body", widget: "markdown" }

  - name: Posts
    label: Posts
    create: true
    extension: mdx
    folder: "src/routes/posts/(records)"
    preview_path: "/posts/{{filename}}"
    summary: "{{title}} · {{audience}}"
    view_filters:
      - { label: Business, field: audience, pattern: business }
      - { label: Developer, field: audience, pattern: developer }
      - { label: Personal, field: audience, pattern: personal }
    fields:
      - { label: "Title", name: "title", widget: "string", minlength: 5 }
      - label: Audience
        name: audience
        widget: select
        options:
          - { label: "Business buyers", value: business }
          - { label: "Developers", value: developer }
          - { label: "Personal", value: personal }
      - { label: "Related products", name: "products", widget: relation, collection: products, value_field: "{{slug}}", search_fields: [title], display_fields: [title], multiple: true, required: false }
      - { label: "Created", name: "created", widget: "datetime", default: "{{now}}" }
      - { label: "Published", name: "published", widget: "datetime", default: "{{now}}" }
      - { label: "Updated", name: "updated", widget: "datetime", required: false }
      - { label: "Featured Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Featured Image Alt", name: "thumbnailAlt", widget: "string", required: false }
      - { label: "Blurb", name: "blurb", widget: "string" }
      - <<: *booking_cta
      - { label: "Body", name: "body", widget: "markdown" }

  - name: Contributors
    label: Contributors
    create: true
    folder: "src/data/contributors/"
    identifier_field: name
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Profile Photo", name: "profilePhoto", widget: "image", required: false }
      - { label: "Role", name: "role", widget: "string", required: false }
      - { label: "Testimony", name: "testimony", widget: "text" }

  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    icon: format_quote
    create: true
    extension: yml
    folder: "src/data/testimonials"
    slug: "{{fields.name}}-{{uuid_short}}"
    summary: "{{name}} · {{organization}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Title", name: "title", widget: "string", required: false }
      - { label: "Organization", name: "organization", widget: "string", required: false }
      - { label: "Quote", name: "quote", widget: "text" }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Photo Alt", name: "photoAlt", widget: "string", required: false }
      - { label: "Source URL", name: "url", widget: "string", type: url, required: false }
      - { label: "Approved", name: "approved", widget: "boolean", default: false, hint: "Only display quotes the person has signed off on" }
      - { label: "Received", name: "received", widget: "datetime", format: "YYYY-MM-DD", default: "{{now}}" }

  - name: Emails
    label: Emails
    create: true
    folder: "public/email-templates/"
    preview_path: "/email-templates/{{filename}}"
    identifier_field: name
    fields:
      - { label: "Template Name", name: "name", widget: "string" }
      - { label: "From Email", name: "from", widget: "string", type: email }
      - { label: "Subject", name: "subject", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
